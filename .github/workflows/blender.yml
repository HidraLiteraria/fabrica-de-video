# 3D na nuvem (11/11) — o Blender (grátis, livre) roda nos computadores emprestados do GitHub; o PC da casa (8 GB, sem placa 3D)
# fica livre. Cada pedido chega num ramo fila-3d/<id> com roda.py. 11/11 (noite): no depósito PÚBLICO fabrica-de-video não há
# limite de minutos, então o desenho é DIVIDIDO entre vários computadores ao mesmo tempo (PARTE/PARTES; até 20) e o último
# passo junta os pedaços. Tudo o que roda.py gravar em saida/ volta no mesmo ramo ("[pronto]").
name: 3D na nuvem
on:
  push:
    branches: ['fila-3d/**']
permissions:
  contents: write
jobs:
  blender:
    if: "!contains(github.event.head_commit.message, '[pronto]')"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: true
      matrix:
        parte: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o Blender 4.2 (LTS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libgl1-mesa-dri libglx-mesa0 xvfb ffmpeg > /dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ
          mv blender-4.2.3-linux-x64 blender
      - name: Rodar (pedaço ${{ matrix.parte }})
        env:
          PARTE: ${{ matrix.parte }}
          PARTES: 8
        run: |
          mkdir -p saida
          set -o pipefail
          xvfb-run -a ./blender/blender -b --factory-startup -noaudio --python-exit-code 1 -P roda.py 2>&1 | tee registro_${{ matrix.parte }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pedaco-${{ matrix.parte }}
          path: saida/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: registro-${{ matrix.parte }}
          path: registro_${{ matrix.parte }}.txt
  juntar:
    needs: blender
    if: "always() && !contains(github.event.head_commit.message, '[pronto]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pedacos
      - name: Juntar os pedaços
        if: needs.blender.result == 'success'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p saida
          # o que não é pedaço (ex.: .glb, .png, .json) vai inteiro
          for f in pedacos/pedaco-*/*; do case "$(basename "$f")" in *_p[0-9][0-9].mp4|tempo_p[0-9][0-9].txt) ;; *) cp -n "$f" saida/ ;; esac; done
          # cada pedaço de vídeo se chama <nome>_pNN.mp4: junta na ordem NN
          for f in pedacos/pedaco-*/*_p[0-9][0-9].mp4; do [ -f "$f" ] && basename "$f" | sed -E 's/_p[0-9]{2}\.mp4$//'; done | sort -u > bases.txt
          while read base; do
            for f in pedacos/pedaco-*/${base}_p[0-9][0-9].mp4; do echo "$(basename "$f") $f"; done | sort | cut -d' ' -f2- | sed "s|^|file '$PWD/|; s|$|'|" > lista.txt
            ffmpeg -y -loglevel error -f concat -safe 0 -i lista.txt -c copy "saida/${base}.mp4"
          done < bases.txt
          cat pedacos/pedaco-*/tempo_p*.txt > saida/tempo.txt 2>/dev/null || true
          git config user.name "fabrica-3d"
          git config user.email "actions@users.noreply.github.com"
          git add -f saida
          git commit -q -m "[pronto] 3D feito"
          git push
      - name: Avisar erro
        if: needs.blender.result != 'success'
        run: |
          git config user.name "fabrica-3d"
          git config user.email "actions@users.noreply.github.com"
          echo "O 3D falhou: veja a aba Actions do GitHub." > erro.txt
          for f in pedacos/registro-*/*.txt; do [ -f "$f" ] && { echo "== $f"; tail -n 60 "$f"; } >> erro.txt; done
          git add erro.txt
          git commit -q -m "[pronto] erro"
          git push
