# 3D na nuvem (11/11) — o Blender (grátis, livre) roda no computador emprestado do GitHub; o PC da casa (8 GB, sem placa 3D)
# fica livre. Cada pedido chega num ramo fila-3d/<id> com roda.py; tudo o que ele gravar em saida/ volta no mesmo ramo ("[pronto]").
name: 3D na nuvem
on:
  push:
    branches: ['fila-3d/**']
permissions:
  contents: write
jobs:
  blender:
    if: "!contains(github.event.head_commit.message, '[pronto]')"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o Blender 4.2 (LTS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libgl1-mesa-dri libglx-mesa0 xvfb ffmpeg > /dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ
          mv blender-4.2.3-linux-x64 blender
      - name: Rodar
        run: |
          mkdir -p saida
          set -o pipefail
          xvfb-run -a ./blender/blender -b --factory-startup -noaudio --python-exit-code 1 -P roda.py 2>&1 | tee registro.txt
      - name: Devolver pronto
        run: |
          git config user.name "fabrica-3d"
          git config user.email "actions@users.noreply.github.com"
          git add -f saida
          git commit -q -m "[pronto] 3D feito"
          git push
      - name: Avisar erro
        if: failure()
        run: |
          git config user.name "fabrica-3d"
          git config user.email "actions@users.noreply.github.com"
          echo "O 3D falhou: veja a aba Actions do GitHub." > erro.txt
          tail -n 80 registro.txt >> erro.txt || true
          git add erro.txt
          git commit -q -m "[pronto] erro"
          git push
